name: "CI"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # composer validation
  composer:
    name: "composer config validation"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
      - name: "Validate composer.json"
        run: "composer validate --strict"

  # PHP lint for different PHP versions
  php:
    name: "PHP ${{ matrix.php-version }}"
    needs: "composer"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
      - name: "setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "json"
          coverage: "xdebug"
          tools: "composer:v2"
          cache: "composer"
      - name: "check PHP version"
        run: "php -v"
      - name: "lint PHP files"
        run: "php -l exceptions/ src/ tests/"
      - name: "install composer dependencies"
        run: "composer install --prefer-dist --no-interaction --no-progress"

  # PHPStan static analysis
  phpstan:
    name: "PHPStan ${{ matrix.php-version }}"
    needs: "composer"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    strategy:
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
      - name: "setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "json"
          tools: "composer:v2"
          cache: "composer"
      - name: "install composer dependencies"
        run: "composer install --prefer-dist --no-interaction --no-progress"
      - name: "PHPStan static analysis"
        run: "vendor/bin/phpstan analyse --configuration=phpstan.neon exceptions/ src/ tests/"

  # run unit tests
  phpunit:
    name: "PHPUnit"
    needs: "composer"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
      - name: "setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.1"
          extensions: "json"
          coverage: "xdebug"
          tools: "composer:v2"
          cache: "composer"
      - name: "check PHP version"
        run: "php -v"
      - name: "install composer dependencies"
        run: "composer install --prefer-dist --no-interaction --no-progress"
      - name: "run PHPUnit"
        run: "php vendor/bin/phpunit --coverage-text"

  codesniffer:
    name: "PHP CodeSniffer"
    needs: "composer"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v7"
      - name: "setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.1"
          extensions: "json"
          tools: "composer:v2"
          cache: "composer"
      - name: "install composer dependencies"
        run: "composer install --prefer-dist --no-interaction --no-progress"
      - name: "check PHP_CodeSniffer version"
        run: "vendor/bin/phpcs --version"
      - name: "PHP CodeSniffer"
        run: "vendor/bin/phpcs"
